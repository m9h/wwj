[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wwj"
version = "0.0.1"
description = "JAX/Equinox port of WeightWatcher (Martin & Mahoney HT-SR; Martin RG theory of learning arXiv 2026). Per-layer spectral diagnostics + a differentiable alpha-toward-2 regularizer for RG-guided optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Morgan Hough", email = "morgan.hough@gmail.com" }]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11.0",
    "jaxtyping>=0.2.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
bayes = [
    "numpyro>=0.15",   # wwjd hierarchical cross-layer model (SVI/NUTS). The conjugate
                       # per-layer posteriors in wwj.bayes need no extra deps; only the
                       # hierarchical population model in wwj.hierarchical imports this.
]
test = [
    "pytest>=8.0",
    "numpyro>=0.15",  # exercises the wwjd hierarchical tests
    "weightwatcher",  # CalculatedContent fork; install editable from /home/mhough/dev/weightwatcher
    "torch>=2.0",     # to load PyTorch ckpts in the cross-project comparison
]
benchmarks = [
    "torch>=2.0",
    "pandas>=2.0",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
    "timm>=1.0",           # for Virchow / Virchow2 / GigaPath via timm.create_model
]

[tool.hatch.build.targets.wheel]
packages = ["src/wwj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
